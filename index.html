function validateBoardSetup(item){
 const setup=item?.format==='splendor-board-seed-v1'?item.setup:(item?.setup||item);
 if(!setup||setup.version!=='classic-2014-v1'||!setup.tiers||!Array.isArray(setup.nobleIds))throw new Error('文件不是本游戏兼容的完整牌序。请勿使用普通对局复盘 JSON。');

spent.y=goldUsed;for(const c of ALL){p.tokens[c]-=spent[c];S.bank[c]+=spent[c]}if(owned(card,p)){p.reserved=p.reserved.filter(x=>x.id!==card.id)}else removeFace(card);p.cards.push(card);p.bonuses[card.color]++;p.score+=card.score;
putLog(who,`${playerLabel(who)} 购买了 ${card.id}（+${C[card.color].name}折扣，${card.score}分）`,{type:'buy',card:clone(card),spent});return true}

function reserve(card,who){let p=S.players[who];if(p.reserved.length>=3||!marketOf(card.id))return false;removeFace(card);p.reserved.push(card);if(S.bank.y>0){S.bank.y--;p.tokens.y++}putLog(who,`${playerLabel(who)} 预留了 ${card.id}`,{type:'reserve',card:clone(card)});return true;}
function blindReserve(t,who){let p=S.players[who];if(p.reserved.length>=3||!S.deck[t].length)return false;const card=S.deck[t].pop();card.blindReserved=true;p.reserved.push(card);if(S.bank.y>0){S.bank.y--;p.tokens.y++}putLog(who,`${playerLabel(who)} 盲抽预留了 ${t} 级卡牌`,{type:'blind_reserve',tier:t,card:matchMode()==='ai'&&who===0?clone(card):{tier:t,faceDown:true}});return true;}
function eligible(who){let p=S.players[who];return S.nobles.filter(n=>COLORS.every(c=>(p.bonuses[c]||0)>=(n.req[c]||0)))}
function gainNoble(who,id){const n=S.nobles.find(x=>x.id===id),p=S.players[who];if(!n||!eligible(who).some(x=>x.id===id))return false;p.nobles.push(n);p.score+=3;S.nobles=S.nobles.filter(x=>x.id!==id);putLog(who,`${playerLabel(who)} 获得贵族 N-${id}（+3分）`,{type:'noble',id});return true}
function autoDiscard(who){const p=S.players[who];while(cnt(p.tokens)>10){let priority=COLORS.map(c=>({c,v:p.tokens[c]/(1+weightedColor(c,p))})).filter(x=>p.tokens[x.c]>0).sort((a,b)=>b.v-a.v);let c=priority[0]?.c||'y';if(!p.tokens[c])c=ALL.find(x=>p.tokens[x]>0);p.tokens[c]--;S.bank[c]++;putLog(who,`${playerLabel(who)} 因超过10枚上限弃掉1枚${C[c].name}宝石`,{type:'discard',color:c})} }
function gameOver(){let a=S.players[0],b=S.players[1],winnerSide=a.score!==b.score?(a.score>b.score?0:1):a.cards.length!==b.cards.length?(a.cards.length<b.cards.length?0:1):-1;
 const winner=winnerSide<0?'平局':playerLabel(winnerSide);S.over=true;S.modal={type:'end',winner,winnerSide};putLog('sys',`对局结束：${playerLabel(0)} ${a.score} 分，${playerLabel(1)} ${b.score} 分。胜者：${winner}`,{type:'end',winner});save();render();}

if(S.modal.need<=0){S.modal=null;const ns=eligible(who);if(ns.length){if(ns.length>1){S.modal={type:'noble',options:ns.map(n=>n.id)};save();render();return}gainNoble(who,ns[0].id)}goNext(who)}else{save();render()}}
function lookAhead(card,p){const pr=price(card,p),needed=pr.left,bonus=weightedColor(card.color,p);let nobleBoost=0;for(const n of S.nobles){const req=n.req[card.color]||0;if(req>0){const left=COLORS.reduce((a,c)=>a+Math.max(0,(n.req[c]||0)-(p.bonuses[c]||0)-(c===card.color?1:0)),0);nobleBoost=Math.max(nobleBoost,Math.max(0,1.4-left*.26))}}
const distance=Math.ceil(needed/2.4);let benefit=card.score*(p.score>=8?2.15:1.55)+(p.cards.length<5?1.25:0.5)*bonus+nobleBoost+(card.tier===1&&p.cards.length<5?.3:0);let speed=1+distance*.57;let utility=benefit/speed;if(card.score===0&&p.cards.length>=8)utility*=.5;if(card.score>=3&&p.score>=8)utility+=2;if(card.score+p.score>=15&&needed<=3)utility+=10;if(p.cards.length<3){utility*=card.tier===1?1.85:card.tier===2?.7:.28}else if(p.cards.length<6){utility*=card.tier===1?1.06:card.tier===2?1.16:.6}else if(p.cards.length<9){utility*=card.tier===3?.85:1.0}return{card,utility,needed,pr}}
function pickTarget(p){const candidates=allOptions(p).map(c=>lookAhead(c,p)).sort((a,b)=>b.utility-a.utility);return candidates[0]}
function simplePlan(p){const target=pickTarget(p);if(!target)return null;let need=COLORS.map(c=>({c,n:Math.max(0,target.pr.req[c]-p.tokens[c])})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);return{target,need}}
function usefulTake(p){const candidates=[];
for(let i=0;i<COLORS.length;i++)for(let j=i+1;j<COLORS.length;j++)for(let k=j+1;k<COLORS.length;k++){let cs=[COLORS[i],COLORS[j],COLORS[k]];if(canTake(cs,1))candidates.push(cs)}
if(COLORS.filter(c=>S.bank[c]>0).length<3){const cs=COLORS.filter(c=>S.bank[c]>0);if(cs.length&&canTake(cs,1))candidates.push(cs)}
for(const c of COLORS)if(S.bank[c]>=4)candidates.push([c,c]);
const top=allOptions(p).map(x=>lookAhead(x,p)).sort((a,b)=>b.utility-a.utility).slice(0,7);
let best=null,score=-Infinity;
for(const cs of candidates){let v=0;for(const op of top){let gain=0;const needed=price(op.card,p).req;
for(const c of cs){if(needed[c]>(p.tokens[c]||0)+cs.slice(0,cs.indexOf(c)).filter(x=>x===c).length)gain+=1}v+=Math.max(0,op.utility)*gain*.26;}
let demand=COLORS.reduce((a,c)=>a+(p.tokens[c]||0),0);v+=cs.length*.17-(cnt(p.tokens)+cs.length>10?2:0);for(const c of cs){if(p.tokens[c]>=4)v-=.45;}v+=botRandom()*.18;
if(v>score){score=v;best=cs}}
return{best,score};}
function botTurn(){if(matchMode()!=='ai'||S.over||S.turn!==1||S.modal)return;const p=S.players[1];let opts=allOptions(p).map(c=>lookAhead(c,p)).sort((a,b)=>b.utility-a.utility),buys=opts.filter(x=>x.needed===0);
let takeopt=usefulTake(p);
let bought=false;
if(buys.length){let b=buys[0];const base=b.card.score*2.2+weightedColor(b.card.color,p)+(p.cards.length<4?1:0);if(b.card.score>0||p.cards.length<5||base>=3.0||cnt(p.tokens)>=8){pay(b.card,1);bought=true}}
if(!bought){let takeChoice=takeopt.best;
if(takeChoice&&cnt(p.tokens)>=9&&buys.length){pay(buys[0].card,1)}
else if(takeChoice){take(takeChoice,1)}
else if(buys.length){pay(buys[0].card,1)}
else if(p.reserved.length<3&&S.bank.y>0){let c=opts.find(x=>marketOf(x.card.id)&&x.card.score>=2);if(c)reserve(c.card,1);else{let c2=getMarketCards()[0];if(c2)reserve(c2,1)}}
else if(getMarketCards().length&&p.reserved.length<3)reserve(getMarketCards()[0],1)
else {putLog('sys','AI 当前没有可执行行动。');goNext(1);return}}
afterAction(1)}

 const record=getBoardHistory().find(x=>x.setup.boardId===d.id);
 if(!record){alert('未找到对应牌序');return}
 try{const setup=validateBoardSetup(record.setup);if(confirm(`恢复牌序 #${setup.boardId} 并从第1回合开始？当前对局进度会重置。`))newGame('restore',setup)}catch(e){alert('恢复失败：'+e.message)}
}
else if(d.act==='tab'){sideTab=d.value;render()}else if(d.act==='view'){compactView=!compactView;document.body.classList.toggle('view-large',!compactView);try{localStorage.setItem('splendor_plus_view',compactView?'compact':'large')}catch(e){}render()}else if(d.act==='export'){exportReplay()}else if(d.act==='new'){openMatchSetup('shuffle')}else if(d.act==='restart-cancel'){S.modal=null;render()}else if(d.act==='restart-replay'){openMatchSetup('replay')}else if(d.act==='restart-shuffle'){openMatchSetup('shuffle')}
else if(d.act==='help'){alert('经典版双人规则：\n\n每回合选择一项：\n1. 拿3种不同颜色各1枚，或在银行至少剩4枚时拿同色2枚；\n2. 买1张公开牌或自己的预留牌；\n3. 预留1张公开牌或盲抽牌（预留上限3），若银行还有金色万能币则同时拿1枚。\n\n每张购买的牌给你永久的颜色成本减免；贵族条件看永久卡数。每回合结束筹码最多10枚；满足多个贵族时只能领1位。先达到15分触发终局，双方完成相同轮数。平分时买卡较少者获胜。\n\n牌面数值按经典版2014的90张发展卡与10位贵族配置（未使用原版美术图像）。可随机洗牌或按同一牌序重玩。')}
else if(d.act==='coach'){S.coach=!S.coach;if(!S.coach&&sideTab==='coach')sideTab='review';if(S.coach)sideTab='coach';render()}
else if(d.act==='gem'){selectGem(d.color)}
else if(d.act==='mode'){setTokenMode(d.value)}
else if(d.act==='card'){selectCard(d.id)}
else if(d.act==='take'){if(S.tokenMode==='diff'&&S.tokenSel.length!==Math.min(3,COLORS.filter(c=>S.bank[c]>0).length)){S.notice='请先选择当前可以拿取的不同颜色宝石。';render()}else if(S.tokenMode==='double'&&S.tokenSel.length!==1){S.notice='先选择1种还有至少4枚的宝石。';render()}else playerTake()}
else if(d.act==='buy'){playerBuy()}
else if(d.act==='reserve'){playerReserve()}
else if(d.act==='blind'){playerBlind(Number(d.tier))}
else if(d.act==='discard'){discardOne(d.color)}
else if(d.act==='noble'){endModalChoice(Number(d.id))}}
try{const saved=JSON.parse(localStorage.getItem('splendor_classic_v4')||'null');if(saved&&saved.rulesVersion==='classic-2014-v1'&&saved.setup?.version==='classic-2014-v1'&&saved.players?.length===2&&saved.market&&saved.bank){S=saved;if(!Array.isArray(S.replay))S.replay=[{index:0,round:S.round,actor:'system',text:'从旧版存档升级；此前的详细行动不可追溯',action:{type:'migrated'},reason:'',publicBoardAfter:publicSnapshot()}];if(!('turnNote'in S))S.turnNote='';if(!S.matchMode)S.matchMode='ai';if(!Array.isArray(S.playerNames)||S.playerNames.length!==2)S.playerNames=['你','AI'];S.coach=false;}}catch(e){}
window.addEventListener('resize',fitDrawerHeight);
document.addEventListener('click',e=>{
 const button=e.target.closest('button[data-drawer]');if(!button)return;
 if(button.dataset.drawer==='close')openDrawer(false);
 else if(button.dataset.drawer==='filter'){drawerFilter=button.dataset.value;renderDrawer();document.getElementById('logEntries').scrollTop=0}
});
if(!S)renderLanding();else{rememberSetup(S.setup);render();}
if(S&&S.turn===1&&matchMode()==='ai'&&!S.over&&!S.modal)setTimeout(botTurn,540);
})();
</script>
